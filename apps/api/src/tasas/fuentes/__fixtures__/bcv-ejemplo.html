    <div id="euro" class="col-sm-12 col-xs-12 ">
      <div class="field-content"><div class="row recuadrotsmc">
        <div class="col-sm-6 col-xs-6"><img src="/sites/default/files/euro-04_2.png"><span> EUR </span></div>
        <div class="col-sm-6 col-xs-6 centrado textp"><strong class="strong-tb"> 40,12345678</strong></div>
      </div></div>
    </div>
    <div id="yuan" class="col-sm-12 col-xs-12">
      <div class="field-content"><div class="row recuadrotsmc">
        <div class="col-sm-6 col-xs-6"><span>CNY</span></div>
        <div class="col-sm-6 col-xs-6 centrado textp"><strong class="strong-tb">5,06010000</strong></div>
      </div></div>
    </div>
    <div id="lira" class="col-sm-12 col-xs-12">

      </div></div>
    </div>

        <div class="col-sm-6 col-xs-6 centrado textp"><strong class="strong-tb">0,41000000</strong></div>
      </div></div>
    </div>
    <div id="dolar" class="col-sm-12 col-xs-12 ">
      <div class="field-content"><div class="row recuadrotsmc">
        <div class="col-sm-6 col-xs-6"><img src="/sites/default/files/dollar-04_2.png"><span> USD</span></div>
        <div class="col-sm-6 col-xs-6 centrado textp"><strong class="strong-tb">36,87340000</strong></div>
      </div></div>
    </div>
    <div class="pull-right dinpro center"><span>Fecha Valor: Lunes, 09 Junio  2026</span></div>
